  .flags{background:rgba(220,38,38,.05);border:1px solid rgba(220,38,38,.2);border-radius:10px;padding:13px 16px;font-size:13px;margin-bottom:16px}

  .arg .math{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:11px}
  .arg p{font-size:14px;line-height:1.68}
  .takeaway{font-size:14px;line-height:1.65;background:var(--panel);border:1px solid var(--line);border-radius:0 8px 8px 0;border-left:3px solid var(--mut);padding:13px 16px;margin-bottom:12px}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 22px}

<script>
const STOCK = {

  future:"<b>Why the IPO:</b> a genuine growth raise — <b>₹4,250cr fresh (78%) + ₹1,171cr OFS</b>; fresh proceeds fund tech, <b>logistics (Valmo)</b>, ads, fintech and working capital. Tellingly, <b>the founders sold only ~0.3%</b> — they're building, not cashing out. <b>Customers:</b> a two-sided network of value-seeking tier-2/3 buyers and small/unbranded sellers; the zero-commission model is what pulls supply. <b>Runway:</b> value commerce is <b>vast and under-penetrated</b> — NMV ₹29,998cr (+29% FY25), +36% in Q1FY26, and the app has been adding users faster than Amazon/Flipkart. <b>Reinvestment:</b> contribution margin to NMV rose 2.9%→4.9%, <b>FCF turned positive (+₹591cr FY25)</b>, and capital is being plowed into logistics + monetisation (ads/fintech) — a real reinvestment runway, though GAAP profit is not here yet.",
  street:"<b>Sell-side:</b> consensus <b>Buy</b> (≈5 buy / 1 sell), avg 12-month target <b>₹187</b> (range ₹155–215); a foreign brokerage initiated with Buy on listing. Commentators called it a <b>'sensibly priced' new-age IPO</b> vs the usual froth — ~6–7× P/S, rich against a 2.2× peer average but <b>cheaper than Eternal/Zomato (&gt;10×)</b>. <b>Read:</b> the post-listing pop (₹235) has de-rated to ₹167, so some asymmetry is back, but at this multiple on a still-loss-making base the market is paying for years of execution. <b>Today the stock is ~29% below its ATH — the athbreak signal is NOT firing; this is a fundamental review, not a live buy trigger.</b>",
  prom:{q:"FOUNDER-LED", c:"var(--bet)", t:"<b>Founder-led with real skin in the game.</b> Co-founders <b>Vidit Aatrey (CEO, ~9.3%)</b> and <b>Sanjeev Barnwal (CTO, ~7.1%)</b> — IIT-Delhi, building since 2015 — together hold ~18.5% and <b>sold only ~0.3% in the IPO</b>, a strong conviction signal. The reverse-flip to an Indian domicile (and the tax it cost) shows commitment to listing here. <b>The caveat:</b> a VC-heavy cap table — <b>Elevation 14.5%, Peak XV 13.6%, Prosus 13.1%, SoftBank 9.9%</b> — means large blocks will look to exit over time (unlock overhang)."},
  pillars:[
   {lbl:"Engine · Growth + runway", pts:2, why:"Lynch: the big money is in fast growers with a long runway — and a category leader compounds that runway.",
    desc:"Revenue <b>+34% to ₹12,626cr (FY26)</b>, NMV +29–36%, leadership in a vast, under-penetrated value-commerce market. <b>A top-tier engine</b> — the opposite of a no-growth PSU."},
   {lbl:"Engine · Reinvestment ability", pts:1, why:"Akre's 3rd leg: a long reinvestment runway only counts if the returns on that capital are high.",
    desc:"Reinvesting hard into logistics/ads/fintech with <b>improving economics</b> (contribution 2.9%→4.9%, FCF +₹591cr) — but it's <b>still net loss-making</b>, so high ROIC is <b>promised, not proven</b>. Hence 1, not 2."},
   {lbl:"Moat & Longevity", pts:1.5, why:"Dorsey: marketplace network effects are a genuine moat — but only if competitors can't simply copy them.",
    desc:"Two-sided network + scale leadership + a zero-commission model that's <b>costly for Amazon/Flipkart to copy</b>. Contested by Flipkart Shopsy, Amazon, <b>ONDC and quick-commerce</b>, and the take-rate is thin — a real but not-yet-wide moat."},
   {lbl:"Alignment", pts:1.5, why:"Skin-in-the-game: founders who barely sell + fresh capital into the business is the gold standard; VC overhang is the offset.",
    desc:"<b>Founder-led, sold only 0.3%</b>, and a <b>78%-fresh issue</b> putting ₹4,250cr into the business — strong alignment. Tempered by large VC blocks (~50% combined) that will unlock over time."},
   {lbl:"Price & Asymmetry", pts:1, why:"Agrawal: 'price comes last' — but a great business at ~6–7× sales while loss-making prices in years of perfect execution.",
    desc:"Premium P/S (~6–7× vs 2.2× peers) on a loss-making base. The ₹235→₹167 de-rate restores some room and the Street sees ₹187 (~12% up, range 155–215) — <b>balanced, not deeply asymmetric.</b>"},
  ],
  qrows:[["Business",2],["Growth",2],["Profit & BS",1],["Structure",2],["Valuation",1]],
  flags:["<b>Still GAAP loss-making</b> (FY26 net loss ₹1,357cr) — profitability / high-ROIC unproven; this caps the reinvestment pillar at 1.","<b>Premium valuation</b> (~6–7× P/S vs 2.2× peers) — the multiple embeds years of execution.","<b>VC unlock overhang</b> — Elevation / Peak XV / Prosus / SoftBank hold ~50% combined.","Listed in a hot window at +46% (Ritter's 'window of opportunity' risk) — but has since de-rated, and the growth is real, not a fad.","<b>Context:</b> ~29% below its post-listing ATH — the athbreak signal is not live today."],
  math:"Engine A 3 (2+1) + Moat B 1.5 + Align C 1.5 + Price D 1 = 7.0 raw  →  no veto (fresh-heavy, founder-led, not a PSU; froth noted but de-rated)  →  7.0/10",
  arg:"This is the profile the framework is built to reward — and a clean contrast to CMPDI. Meesho has a <b>genuine engine</b> (A=3): a category-leading, fast-growing platform in a vast under-penetrated market, with the <b>reinvestment runway</b> CMPDI lacks and a <b>fresh-heavy issue + barely-selling founders</b> funding it. That's real compounding raw material, and on the pure quality/landmine screen it's an 8 (BET). The opportunity score lands at <b>7.0 — OPPORTUNITY, not yet CONVICTION</b> — for two honest reasons the integers capture: <b>(1)</b> the returns on all that reinvestment are <b>not proven</b> (it's still loss-making, so A2 is 1 not 2), and <b>(2)</b> at ~6–7× sales the <b>price already embeds years of flawless execution</b>, so the asymmetry is balanced rather than fat (D=1). The moat is real but contested (ONDC, quick-commerce, thin take-rate). Net: a high-quality compounder you'd happily own — at the right size and ideally a better price.",
  take:"The best opportunity of the IPOs we've reviewed — a true growth engine, aligned founders, fresh capital — held below CONVICTION only by an unproven path to profit and a full valuation. <b>Build a starter / half position, add on weakness and as GAAP profitability confirms;</b> don't pay up at the top of the range. (And note: no live athbreak signal today — it's 29% below its ATH.)",
  teaches:"<b>A real engine still has to be bought right.</b> Meesho is everything CMPDI isn't — growth, runway, reinvestment, aligned owners — which is why it scores far higher. But two of the four pillars (proven returns, price) keep it at OPPORTUNITY, not CONVICTION. The lesson: <i>find the compounder first, then demand that profitability is proving out and the price still leaves you asymmetry.</i> Great business + full price + unproven profit = a position you build patiently, not a table-pounding bet."
};

const OVCLS = v => v==="CONVICTION"?"v-BET":v==="OPPORTUNITY"?"v-SELECTIVE":"v-BYE";
const QVCLS = v => v==="BET"?"v-BET":v==="SELECTIVE"?"v-SELECTIVE":"v-BYE";
const BARCOL = (p,mx)=> p/mx>=1?"var(--bet)":p/mx>=.5?"var(--sel)":"var(--bye)";

const tabs=document.getElementById("tabs"), panes=document.getElementById("panes");

/* ---- Framework / education tab ---- */
const et=document.createElement("div");
et.className="tab edu active";et.innerHTML="📘 How to read this";
et.onclick=()=>select(0);
tabs.appendChild(et);
const ep=document.createElement("div");
ep.className="pane active";
ep.innerHTML=`
  <p class="lead">A technical signal tells you <b>when</b> a young stock breaks out; the runbook tells you <b>whether it's safe</b>; this report answers the question that builds wealth: <b>is it a multi-year compounding <i>opportunity</i>, bought before the crowd?</b> Most IPOs underperform (Ritter: ~34% vs 62% over 3 years), so the bar is high. We lead with the <b>opportunity score (QGLP-A)</b> and show the runbook <b>quality score</b> alongside as a safety check.</p>
  <div class="pillar-def"><h4><span>A · ENGINE</span>Does it actually compound? (the gate)</h4><p><b>A1 Growth + runway</b> — growing fast with a large, under-penetrated market? <b>A2 Reinvestment</b> — can it redeploy profits at a high return? <b>If Engine ≤ 1, the score caps at 4</b> — a profitable slow-grower or dividend payer is not an opportunity.</p></div>
  <div class="pillar-def"><h4><span>B · MOAT</span>Will the high return persist? (longevity)</h4><p>A durable moat — brand, switching costs, network, cost edge — is why returns don't mean-revert. A leader in a contested or decaying market has its longevity capped.</p></div>
  <div class="pillar-def"><h4><span>C · ALIGNMENT</span>Will the compounding accrue to me?</h4><p>Founder-owners with wealth on the line and <b>fresh capital into the business</b> &gt;&gt; professional managers &gt;&gt; pure-OFS cash-outs (PE or government). In an OFS, the seller knows more than you.</p></div>
  <div class="pillar-def"><h4><span>D · PRICE</span>Is the upside still on the table?</h4><p>"Price comes last" — but if the stock has already re-rated to fair value/targets, the asymmetry is gone even if the business is fine. The opportunity lives at the <i>entry price</i>.</p></div>
  <div class="veto"><b>Structural vetoes (cap, never add):</b> &nbsp; PSU/govt → cap 5 &nbsp;·&nbsp; pure-OFS → cap 6 &nbsp;·&nbsp; froth listing → cap 6 &nbsp;·&nbsp; no engine (A ≤ 1) → cap 4.</div>
  <h2 class="section">Verdict bands</h2>

    <tr><th>Band</th><th>Score</th><th>Meaning</th></tr>
    <tr><td><span class="verdict-badge v-BET">CONVICTION</span></td><td class="s">8–10</td><td>A genuine compounder, aligned, upside left. Size up.</td></tr>
    <tr><td><span class="verdict-badge v-SELECTIVE">OPPORTUNITY</span></td><td class="s">6–7.5</td><td>Real engine, one leg weak (price / proof / alignment). Build / half-size.</td></tr>

    <tr><td><span class="verdict-badge v-BYE">AVOID</span></td><td class="s">&lt;4</td><td>Steer clear.</td></tr>
  </table>

    <div class="book"><div class="bk">Chuck Akre — three-legged stool</div><div class="bi">High compounding × honest owner-managers × a runway to reinvest free cash.</div></div>
    <div class="book"><div class="bk">Raamdeo Agrawal — QGLP</div><div class="bi">Quality × Growth × Longevity × Price. "Price comes last."</div></div>
    <div class="book"><div class="bk">Peter Lynch — <i>One Up on Wall Street</i></div><div class="bi">The money is in fast growers with a runway, not slow growers in disguise.</div></div>

    <div class="book"><div class="bk">Jay Ritter — IPO long-run studies</div><div class="bi">IPOs underperform; worst in hot windows. The seller knows more than you.</div></div>
  </div>`;

    <div>
      <h2>${s.sym}</h2>
      <div class="name">${s.name}</div>
      <div class="sig">Listed <b>${s.sig.list}</b> · age <b>${s.sig.age}</b> · last price ₹${s.sig.px} (<b>2026-06-16</b>)<br>
        <b>No live athbreak signal</b> — trading ~29% below its post-listing ATH. Fundamental opportunity review.</div>
    </div>
    <div class="bigscore">
      <div class="lab">Opportunity score</div>
      <div><span class="num" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</span><span class="den">/10</span></div>
      <div class="verdict-badge ${OVCLS(s.opp.verdict)}">${s.opp.verdict}</div>
      <div class="qchip">Quality screen: <b>${s.qual.score}/10</b> · <span class="${QVCLS(s.qual.verdict)}" style="padding:1px 7px;border-radius:8px">${s.qual.verdict}</span></div>
    </div>
  </div>
  <div class="mstrip">${mstrip}</div>
  <div class="card"><h3>What it does</h3><p style="font-size:14px;line-height:1.65;color:#3a4453">${s.desc}</p></div>
  <div class="card"><h3>Future prospects · why the IPO · customers</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.future}</p></div>
  <div class="card"><h3>Street view &amp; recent news</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.street}</p></div>
  <div class="prom"><h3>Promoters &amp; management <span class="q" style="background:${s.prom.c}22;color:${s.prom.c};border:1px solid ${s.prom.c}55">${s.prom.q}</span></h3><p>${s.prom.t}</p></div>
  <div class="card"><h3>Opportunity scorecard — QGLP-A <span class="tagline">the 4 pillars · each with why it matters</span></h3>${pillars}</div>
  <div class="card"><h3>Quality screen (runbook 5-lens) <span class="tagline">the safety check — is it a landmine?</span></h3><div class="lens-mini">${qmini}</div></div>
  ${flags}
  <div class="arg"><h3>⚖️ Why this score</h3><div class="math">${s.math}</div><p>${s.arg}</p></div>
  <div class="takeaway"><b>Bottom line.</b> ${s.take}</div>
  <div class="teach"><b>📚 What this teaches you.</b> ${s.teaches}</div>`;
panes.appendChild(p);

function select(n){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n));
  document.querySelectorAll(".pane").forEach((p,i)=>p.classList.toggle("active",i===n));
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
