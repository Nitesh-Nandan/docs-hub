    <div class="book"><div class="bk">Saurabh Mukherjea — <i>Coffee Can Investing</i></div><div class="bi">Avoid PSUs; compounders held for years make multibaggers.</div></div>
    <div class="book"><div class="bk">Jay Ritter — IPO long-run studies</div><div class="bi">IPOs underperform; worst in hot windows. The seller knows more than you.</div></div>
  </div>`;
panes.appendChild(ep);

/* ---- stock tab ---- */
const s=STOCK;
const t=document.createElement("div");
t.className="tab";
t.innerHTML=`<span class="dot" style="background:${OVDOT(s.opp.verdict)}"></span>${s.sym}
  <span class="score-pill" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</span>`;
t.onclick=()=>select(1);
tabs.appendChild(t);

const pillars=s.pillars.map(r=>`
  <div class="row">
    <div class="lbl"><span>${r.lbl}</span><span class="pts" style="color:${BARCOL(r.pts,2)}">${r.pts}/2</span></div>
    <div class="bar"><i style="width:${r.pts/2*100}%;background:${BARCOL(r.pts,2)}"></i></div>
    <div class="desc">${r.desc}</div>
    <div class="why">Why it matters — ${r.why}</div>
  </div>`).join("");
const qmini=s.qrows.map(q=>`<div class="lm"><div class="t">${q[0]}</div><div class="p" style="color:${BARCOL(q[1],2)}">${q[1]}/2</div></div>`).join("");
const mstrip=s.m.map(x=>`<div class="metric"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("");
const flags=`<div class="flags"><b>Caps &amp; red flags</b>${s.flags.map(f=>"• "+f).join("<br>")}</div>`;

const p=document.createElement("div");
p.className="pane";
p.innerHTML=`
  <div class="shead">
    <div>
      <h2>${s.sym}</h2>
      <div class="name">${s.name}</div>
      <div class="sig">Listed <b>${s.sig.list}</b> · age <b>${s.sig.age}</b> · last price ₹${s.sig.px} (<b>${s.sig.date}</b>)<br>
        <b>LIVE athbreak signal</b> — +14.6% to an all-time high (₹522 upper circuit) on ~33× normal volume. Opportunity review of a live trigger.</div>
    </div>
    <div class="bigscore">
      <div class="lab">Opportunity score</div>
      <div><span class="num" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</span><span class="den">/10</span></div>
      <div class="verdict-badge ${OVCLS(s.opp.verdict)}">${s.opp.verdict}</div>
      <div class="qchip">Quality screen: <b>${s.qual.score}/10</b> · <span class="${QVCLS(s.qual.verdict)}" style="padding:1px 7px;border-radius:8px">${s.qual.verdict}</span></div>
    </div>
  </div>
  <div class="mstrip">${mstrip}</div>
  <div class="card"><h3>What it does</h3><p style="font-size:14px;line-height:1.65;color:#3a4453">${s.desc}</p></div>
  <div class="card"><h3>Future prospects · why the IPO · customers</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.future}</p></div>
  <div class="card"><h3>Street view &amp; recent news</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.street}</p></div>
  <div class="prom"><h3>Promoters &amp; management <span class="q" style="background:${s.prom.c}22;color:${s.prom.c};border:1px solid ${s.prom.c}55">${s.prom.q}</span></h3><p>${s.prom.t}</p></div>
  <div class="card"><h3>Opportunity scorecard — QGLP-A <span class="tagline">the 4 pillars · each with why it matters</span></h3>${pillars}</div>
  <div class="card"><h3>Quality screen (runbook 5-lens) <span class="tagline">the safety check — is it a landmine?</span></h3><div class="lens-mini">${qmini}</div></div>
  ${flags}
  <div class="arg"><h3>⚖️ Why this score</h3><div class="math">${s.math}</div><p>${s.arg}</p></div>
  <div class="takeaway"><b>Bottom line.</b> ${s.take}</div>
  <div class="teach"><b>📚 What this teaches you.</b> ${s.teaches}</div>
  <div class="note">* 20d avg turnover ₹18cr is inflated by today's ₹231cr breakout-day spike; the prior-19-day average is only ~₹7cr/day — liquidity is thin outside event days, which matters for sizing and exits.</div>`;
panes.appendChild(p);

function select(n){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n));
  document.querySelectorAll(".pane").forEach((p,i)=>p.classList.toggle("active",i===n));
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
