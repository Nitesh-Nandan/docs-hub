const OVDOT = v => v==="CONVICTION"?"var(--bet)":v==="OPPORTUNITY"?"var(--sel)":"var(--bye)";
const OVCLS = v => v==="CONVICTION"?"v-BET":v==="OPPORTUNITY"?"v-SELECTIVE":"v-BYE";
const QVCLS = v => v==="BET"?"v-BET":v==="SELECTIVE"?"v-SELECTIVE":"v-BYE";
const BARCOL = (p,mx)=> p/mx>=1?"var(--bet)":p/mx>=.5?"var(--sel)":"var(--bye)";

const tabs=document.getElementById("tabs"), panes=document.getElementById("panes");

/* ---- Framework / education tab (first) ---- */
const et=document.createElement("div");
et.className="tab edu active";et.innerHTML="📘 How to read this";
et.onclick=()=>select(0);
tabs.appendChild(et);

const ep=document.createElement("div");
ep.className="pane active";
ep.innerHTML=`
  <p class="lead">A technical signal tells you <b>when</b> a young stock breaks out. The runbook tells you <b>whether it's safe</b> (not a fraud or value trap). This report answers the question that actually builds wealth: <b>is it a multi-year compounding <i>opportunity</i>, bought before the crowd?</b> Most IPOs are not — Jay Ritter's research shows IPOs underperform peers ~34% vs 62% over three years. So the bar is high, and we lead with the <b>opportunity score (QGLP-A)</b>, showing the runbook <b>quality score</b> alongside as a safety check.</p>

  <h2 class="section">The 4 pillars — score the opportunity 0–10</h2>
  <div class="pillar-def"><h4><span>A · ENGINE</span>Does it actually compound? (the gate)</h4><p>Two sub-questions: <b>A1 Growth + runway</b> — is it growing fast with a large, under-penetrated market to keep growing? <b>A2 Reinvestment</b> — can it redeploy profits at a high return (low payout, capital base compounding)? <b>If the Engine ≤ 1, the whole score is capped at 4</b> — a profitable slow-grower or dividend payer is not an opportunity, however high its ROE.</p></div>
  <div class="pillar-def"><h4><span>B · MOAT</span>Will the high return persist? (longevity)</h4><p>A durable moat — brand, switching costs, network, cost edge — is <i>why</i> returns don't mean-revert. A <b>borrowed</b> moat (licensed brand) or a monopoly in a decaying market has its longevity capped.</p></div>
  <div class="pillar-def"><h4><span>C · ALIGNMENT</span>Will the compounding accrue to me?</h4><p>Founder-owners with wealth on the line and <b>fresh capital going into the business</b> &gt;&gt; professional managers &gt;&gt; <b>pure-OFS cash-outs</b> (PE, government, or an MNC parent). In an OFS, the seller knows more than you; royalty/fee leakage to a parent also diverts the upside.</p></div>
  <div class="pillar-def"><h4><span>D · PRICE</span>Is the upside still on the table?</h4><p>"Price comes last" — but if the stock has already re-rated to fair value or analyst targets, the asymmetry is gone even if the business is fine. The opportunity lives at the <i>entry price</i>.</p></div>

  <div class="veto"><b>Structural vetoes (cap the score, never add):</b> &nbsp; Government/PSU control → cap 5 &nbsp;·&nbsp; Pure-OFS (no fresh capital) → cap 6 &nbsp;·&nbsp; Hot-market froth listing → cap 6 &nbsp;·&nbsp; No engine (A ≤ 1) → cap 4.</div>

  <h2 class="section">Verdict bands</h2>
  <table>
    <tr><th>Band</th><th>Score</th><th>Meaning</th></tr>
    <tr><td><span class="verdict-badge v-BET">CONVICTION</span></td><td class="s">8–10</td><td>A genuine compounder, aligned, upside left. Size up.</td></tr>
    <tr><td><span class="verdict-badge v-SELECTIVE">OPPORTUNITY</span></td><td class="s">6–7.5</td><td>Real engine, one leg weak (price / alignment / proof). Half-size or wait.</td></tr>
    <tr><td><span class="verdict-badge v-BYE">NOT AN OPPORTUNITY</span></td><td class="s">4–5.5</td><td>May be a fine company, but won't compound for you — or you've missed the entry. Pass.</td></tr>
    <tr><td><span class="verdict-badge v-BYE">AVOID</span></td><td class="s">&lt;4</td><td>Steer clear.</td></tr>
  </table>

  <h2 class="section">Where this comes from — the reading list</h2>
  <div class="card" style="padding:8px 22px">
    <div class="book"><div class="bk">Christopher Mayer — <i>100 Baggers</i></div><div class="bi">"Twin engines": sustained EPS growth × a long reinvestment runway, run by owner-operators. You don't get 100× from a dividend payer.</div></div>
    <div class="book"><div class="bk">Chuck Akre — three-legged stool</div><div class="bi">Compounding at a high rate × honest owner-managers × a runway to reinvest free cash. Leg 3 is the one everyone forgets.</div></div>
    <div class="book"><div class="bk">Raamdeo Agrawal — QGLP</div><div class="bi">Quality × Growth × Longevity × Price. "Price comes last" — longevity turns growth into wealth.</div></div>
    <div class="book"><div class="bk">Peter Lynch — <i>One Up on Wall Street</i></div><div class="bi">Categorise first; the money is in fast growers with a runway, not "slow growers" wearing a quality mask.</div></div>
    <div class="book"><div class="bk">Saurabh Mukherjea — <i>Coffee Can Investing</i></div><div class="bi">Compounders held for years make multibaggers; cheapness without an engine doesn't compensate.</div></div>
    <div class="book"><div class="bk">Jay Ritter — IPO long-run studies</div><div class="bi">IPOs underperform peers over 3 years; worst in hot "windows of opportunity." The seller knows more than you.</div></div>
  </div>
  <div class="note">Read the two tabs as a matched pair: <b>TIMEX</b> = a real growth engine, but a value-extracting MNC parent (pure-OFS, royalty leak, borrowed brands) bought rich at ~58x; <b>POWERICA</b> = safer &amp; better-aligned (founder, fresh capital, quality 7) but <b>no compounding engine</b> (flat-topline cyclical). The <i>higher-quality</i> name scores <i>lower</i> on opportunity — that flip is the whole lesson. <b>And note:</b> TIMEX isn't even a fresh IPO — it's an old MNC sub that just arrived on NSE — a reminder to always check what the "listing" actually is.</div>`;
panes.appendChild(ep);

/* ---- per-stock tabs ---- */
STOCKS.forEach((s,i)=>{
  const idx=i+1;
  const t=document.createElement("div");
  t.className="tab";
  t.innerHTML=`<span class="dot" style="background:${OVDOT(s.opp.verdict)}"></span>${s.sym}
    <span class="score-pill" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</span>`;
  t.onclick=()=>select(idx);
  tabs.appendChild(t);

  const pillars=s.pillars.map(r=>`
    <div class="row">
      <div class="lbl"><span>${r.lbl}</span><span class="pts" style="color:${BARCOL(r.pts,2)}">${r.pts}/2</span></div>
      <div class="bar"><i style="width:${r.pts/2*100}%;background:${BARCOL(r.pts,2)}"></i></div>
      <div class="desc">${r.desc}</div>
      <div class="why">Why it matters — ${r.why}</div>
    </div>`).join("");
  const qmini=s.qrows.map(q=>`<div class="lm"><div class="t">${q[0]}</div><div class="p" style="color:${BARCOL(q[1],2)}">${q[1]}/2</div></div>`).join("");
  const flags=`<div class="flags${s.flagsClean?" clean":""}"><b>${s.flagsClean?"Caps / flags — clean":"Caps &amp; red flags"}</b>${s.flags.map(f=>"• "+f).join("<br>")}</div>`;

  const p=document.createElement("div");
  p.className="pane";
  p.innerHTML=`
    <div class="shead">
      <div>
        <h2>${s.sym}</h2>
        <div class="name">${s.name}</div>
        <div class="sig">Signal: <b>athbreak</b> at ₹${s.sig.px} on <b>${s.sig.date}</b><br>
          Listed <b>${s.sig.list}</b> · age at signal <b>${s.sig.age}</b></div>
      </div>
      <div class="bigscore">
        <div class="lab">Opportunity score</div>
        <div><span class="num" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</span><span class="den">/10</span></div>
        <div class="verdict-badge ${OVCLS(s.opp.verdict)}">${s.opp.verdict}</div>
        <div class="qchip">Quality screen: <b>${s.qual.score}/10</b> · <span class="${QVCLS(s.qual.verdict)}" style="padding:1px 7px;border-radius:8px">${s.qual.verdict}</span></div>
      </div>
    </div>
    <div class="mstrip">
      <div class="metric"><div class="k">Issue / 1st px</div><div class="v">${s.m.issue}</div></div>
      <div class="metric"><div class="k">Now</div><div class="v">${s.m.now}</div></div>
      <div class="metric"><div class="k">From listing</div><div class="v ${s.m.frm_list.startsWith('-')?'neg':'pos'}">${s.m.frm_list}</div></div>
      <div class="metric"><div class="k">20d turnover</div><div class="v">${s.m.to_liq}</div></div>
    </div>
    <div class="card"><h3>What it does</h3><p style="font-size:14px;line-height:1.65;color:#3a4453">${s.desc}</p></div>
    <div class="card"><h3>Future prospects · why the IPO · customers</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.future}</p></div>
    <div class="card"><h3>Street view &amp; recent news</h3><p style="font-size:13.5px;line-height:1.7;color:#3a4453">${s.street}</p></div>
    <div class="prom"><h3>Promoters &amp; management <span class="q" style="background:${s.prom.c}22;color:${s.prom.c};border:1px solid ${s.prom.c}55">${s.prom.q}</span></h3><p>${s.prom.t}</p></div>
    <div class="card"><h3>Opportunity scorecard — QGLP-A <span class="tagline">the 4 pillars · each with why it matters</span></h3>${pillars}</div>
    <div class="card"><h3>Quality screen (runbook 5-lens) <span class="tagline">the safety check — is it a landmine?</span></h3><div class="lens-mini">${qmini}</div></div>
    ${flags}
    <div class="arg"><h3>⚖️ Why this score</h3><div class="math">${s.math}</div><p>${s.arg}</p></div>
    <div class="takeaway"><b>Bottom line.</b> ${s.take}</div>
    <div class="teach"><b>📚 What this teaches you.</b> ${s.teaches}</div>`;
  panes.appendChild(p);
});

/* ---- Where to invest tab ---- */
const vt=document.createElement("div");
vt.className="tab verdict";vt.innerHTML="🎯 Where to Invest";
vt.onclick=()=>select(STOCKS.length+1);
tabs.appendChild(vt);

const ranked=[...STOCKS].sort((a,b)=>b.opp.score-a.opp.score);
const trows=ranked.map((s,i)=>`
  <tr class="${i===0?'rank1':''}">
    <td>${i+1}</td><td><b>${s.sym}</b></td>
    <td class="s" style="color:${OVDOT(s.opp.verdict)}">${s.opp.score}</td>
    <td><span class="verdict-badge ${OVCLS(s.opp.verdict)}">${s.opp.verdict}</span></td>
    <td class="s" style="color:var(--mut)">${s.qual.score}</td>
  </tr>`).join("");

const vp=document.createElement("div");
vp.className="pane";
vp.innerHTML=`
  <h2 class="section">The ranking — by opportunity, not by quality</h2>
  <table>
    <tr><th>#</th><th>Symbol</th><th>Opp score</th><th>Verdict</th><th>Quality</th></tr>
    ${trows}
  </table>

  <div class="pick">
    <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--bye)"></span> Neither is a buy today — and the higher-quality name is the lower opportunity</h3>
    <div class="alloc">No capital deployed · both to watchlist for different triggers</div>
    <p><b>TIMEX (6.0)</b> is the better <i>opportunity</i> only because it has the real growth engine (rev +48%, Q4 PAT +196%, premiumisation runway) — but it's a value-leaking MNC <b>pure-OFS</b> (not even a fresh IPO) bought at ~58x at a fresh ATH, so the trigger is a <b>pullback</b>, and even then half-size. <b>POWERICA (5.0)</b> is the higher-<i>quality</i>, better-<i>aligned</i> business (founder-owned, fresh capital, ROCE ~27%, quality 7) — but it has <b>no compounding engine</b> (flat FY26 topline, cyclical diesel + capital-heavy wind), so it's a fine deleveraging cyclical, not a wealth compounder. The trigger there is <b>evidence of real, sustained growth</b>, not just a cheaper price.</p>
  </div>

  <div class="note">
    <b>The lesson of this pair:</b> the safer, better-governed company (Powerica, quality 7) ranks <i>below</i> the riskier one (Timex, quality 6) on the opportunity lens — because opportunity is led by the <b>engine</b>, and Timex has growth while Powerica is a flat-topline cyclical. But Timex's engine is owned by a foreign parent that cashes out and charges royalties, priced at 58x — so "better opportunity" still means "wait." <b>Lead with the engine, demand alignment, insist on asymmetry at the entry price — and remember most IPOs (and pseudo-IPOs) are a pass.</b>
  </div>`;
panes.appendChild(vp);

function select(n){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n));
  document.querySelectorAll(".pane").forEach((p,i)=>p.classList.toggle("active",i===n));
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
