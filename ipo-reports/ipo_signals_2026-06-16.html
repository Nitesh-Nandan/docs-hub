  prom:{q:"MNC PARENT", c:"var(--sel)", t:"Parent is <b>Unilever's Magnum Ice Cream Company</b> (post the 2025 HUL ice-cream demerger) — a credible global owner on paper. But this is a <b>demerger, not an IPO</b>: there was no fresh capital raise, no anchor process, and no promoter putting money in at a vetted price. The owner's quality can't rescue a business currently bleeding cash."},
  rows:[
   [1,"Business quality","Strong brands, but a competitive category (Amul, Vadilal, regionals)."],
   [0,"Growth","Q3FY26 revenue <b>fell 30% YoY</b> — going the wrong way."],
   [0,"Profitability & BS","<b>Loss-making</b> — ₹109cr loss in Q3FY26."],
   [0,"IPO structure","Demerger, not an IPO — no fresh capital, no alignment; trades in 'T' group."],
   [0,"Valuation","₹8,190cr market cap on falling revenue and losses — no earnings to value against."],
  ],
  flags:["Loss-making with revenue down 30% YoY.","A demerger listing in the surveillance 'T' group — not a fresh IPO.","The ATH 'breakout' is just post-demerger price discovery noise."],
  math:"Business 1 + Growth 0 + Profit 0 + Structure 0 + Valuation 0 = 1/10",
  arg:"Four zeros and a single point for brand equity. The business is <b>loss-making with revenue down 30%</b>, it is a <b>demerger not an IPO</b> (no capital raised, trades in the surveillance 'T' group), and there are no earnings to value the ₹8,190cr market cap against. The ATH 'breakout' is just post-demerger price discovery — pure noise. This is the textbook case for why a technical signal must never be acted on alone. 1/10 — ignore entirely.",
  take:"The clearest example of why the human filter exists: a textbook technical signal on a loss-making demerger with collapsing revenue. Ignore it."},
];

const VCLASS = v => v==="BET"?"v-BET":v==="SELECTIVE"?"v-SELECTIVE":"v-BYE";
const VDOT   = v => v==="BET"?"var(--bet)":v==="SELECTIVE"?"var(--sel)":"var(--bye)";
const BARCOL = p => p===2?"var(--bet)":p===1?"var(--sel)":"var(--bye)";

const tabs=document.getElementById("tabs"), panes=document.getElementById("panes");

STOCKS.forEach((s,i)=>{
  const t=document.createElement("div");
  t.className="tab"+(i===0?" active":"");
  t.innerHTML=`<span class="dot" style="background:${VDOT(s.verdict)}"></span>${s.sym}
    <span class="score-pill" style="color:${VDOT(s.verdict)}">${s.score}</span>`;
  t.onclick=()=>select(i);
  tabs.appendChild(t);

  const rows=s.rows.map(r=>`
    <div class="row">
      <div class="lbl"><span>${r[1]}</span><span class="pts" style="color:${BARCOL(r[0])}">${r[0]}/2</span></div>
      <div class="bar"><i style="width:${r[0]/2*100}%;background:${BARCOL(r[0])}"></i></div>
      <div class="desc">${r[2]}</div>
    </div>`).join("");
  const flags=`<div class="flags${s.flagsClean?" clean":""}"><b>${s.flagsClean?"Red flags — clean":"Red flags"}</b>${s.flags.map(f=>"• "+f).join("<br>")}</div>`;

  const p=document.createElement("div");
  p.className="pane"+(i===0?" active":"");
  p.innerHTML=`
    <div class="shead">
      <div>
        <h2>${s.sym}</h2>
        <div class="name">${s.name}</div>
        <div class="sig">Signal: <b>athbreak</b> at ₹${s.sig.px} on <b>${s.sig.date}</b><br>
          Listed <b>${s.sig.list}</b> · age at signal <b>${s.sig.age}</b></div>
      </div>
      <div class="bigscore">
        <div><span class="num" style="color:${VDOT(s.verdict)}">${s.score}</span><span class="den">/10</span></div>
        <div class="verdict-badge ${VCLASS(s.verdict)}">${s.verdict}</div>
      </div>
    </div>
    <div class="mstrip">
      <div class="metric"><div class="k">Issue px</div><div class="v">${s.m.issue}</div></div>
      <div class="metric"><div class="k">Now</div><div class="v">${s.m.now}</div></div>
      <div class="metric"><div class="k">From listing</div><div class="v ${s.m.frm_list.startsWith('-')?'neg':'pos'}">${s.m.frm_list}</div></div>
      <div class="metric"><div class="k">20d turnover</div><div class="v">${s.m.to_liq}</div></div>
    </div>
    <div class="card"><h3>What it does</h3><p style="font-size:14px;line-height:1.65;color:#c9d1d9">${s.desc}</p></div>
    <div class="prom"><h3>Promoters &amp; management <span class="q" style="background:${s.prom.c}22;color:${s.prom.c};border:1px solid ${s.prom.c}55">${s.prom.q}</span></h3><p>${s.prom.t}</p></div>
    <div class="card"><h3>Scorecard — 5 lenses (RUNBOOK_fundamentals.md)</h3>${rows}</div>
    ${flags}
    <div class="arg"><h3>⚖️ Why this score</h3><div class="math">${s.math}</div><p>${s.arg}</p></div>
    <div class="takeaway"><b>Bottom line.</b> ${s.take}</div>`;
  panes.appendChild(p);
});

const vt=document.createElement("div");
vt.className="tab verdict";vt.innerHTML="🎯 Where to Invest";
vt.onclick=()=>select(STOCKS.length);
tabs.appendChild(vt);

const ranked=[...STOCKS].sort((a,b)=>b.score-a.score);
const trows=ranked.map((s,i)=>`
  <tr class="${i===0?'rank1':''}">
    <td>${i+1}</td><td><b>${s.sym}</b></td><td>${s.name}</td>
    <td class="s" style="color:${VDOT(s.verdict)}">${s.score}</td>
    <td><span class="verdict-badge ${VCLASS(s.verdict)}">${s.verdict}</span></td>
  </tr>`).join("");

const vp=document.createElement("div");
vp.className="pane";
vp.innerHTML=`
  <h2 class="section">The ranking — 8 signals, fundamentally sorted</h2>
  <table>
    <tr><th>#</th><th>Symbol</th><th>Company</th><th>Score</th><th>Verdict</th></tr>
    ${trows}
  </table>

  <h2 class="section">Where to put money — and why</h2>

  <div class="pick top">
    <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--bet)"></span> 1 · ICICIAMC — core conviction buy</h3>
    <div class="alloc">Suggested: full position · hold for years</div>
    <p>The only name that clears the BET bar (8/10). India's #2 asset manager is an asset-light, ~83%-ROE, zero-debt compounder with 18-year stable, blue-chip management (Nimesh Shah / S Naren) riding the SIP wave. The single knock — a pure-OFS issue — is irrelevant for a franchise of this quality. This is the kind of IPO the whole strategy exists to catch.</p>
  </div>

  <div class="pick top">
    <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--sel)"></span> 2 · SEDEMAC — high-growth satellite, buy in tranches</h3>
    <div class="alloc">Suggested: half position · stagger on pullbacks</div>
    <p>Elite founder (IIT-B professor) and +120% PAT growth in a real engineering niche. Held to half-size by three things: the issue was 100% OFS, the anchor lock-in is unlocking right now, and the price is already +88% since listing. Accumulate on weakness rather than chasing the breakout.</p>
  </div>

  <div class="pick">
    <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--sel)"></span> 3 · watchlist — SUDEEPPHRM &amp; ADVAIT (6/10)</h3>
    <div class="alloc">Suggested: track, don't buy yet</div>
    <p><b>SUDEEPPHRM</b> — high-margin exporter but ~8% revenue growth and an 89%-OFS (promoter cash-out) issue; wait for a faster quarter. <b>ADVAIT</b> — strong +80% revenue on the energy-transition theme, but it's a BSE→NSE cross-listing (not a true young IPO) with thin liquidity. Both are "prove it" names.</p>
  </div>

  <div class="pick">
    <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--bye)"></span> Pass — AYE, GSPCROP, BHARATCOAL, KWIL</h3>
    <div class="alloc">The signal fired; the fundamentals veto</div>
    <p><b>AYE</b>: undersubscribed IPO (0.97×) + ROE halving. <b>GSPCROP</b>: worst liquidity, levered, no post-listing quarter. <b>BHARATCOAL</b>: commodity coal PSU OFS with ESG headwind, signal already faded. <b>KWIL</b>: loss-making HUL ice-cream demerger with revenue down 30% — not an IPO at all.</p>
  </div>

  <div class="note">
    <b>How to read this:</b> the IPO_ATHBREAK signal tells you <i>when</i> a young listing breaks out on conviction volume — it surfaced all 8 of these. This report is the <i>whether</i>, and every score is argued from evidence (business, promoter/management, financials, structure, valuation, news), not asserted. Of 8 technical signals, exactly <b>1 is a clear buy</b> and 1 a measured half-size; the other 6 score ≤6. That is the fundamental filter doing its job — the strategy's own robustness test showed the signal alone barely beats random, so this human gate is where the edge actually lives. Three of the eight (ADVAIT, BHARATCOAL, KWIL) aren't even fresh IPOs — always confirm the listing's nature, not just the chart.
  </div>`;
panes.appendChild(vp);

function select(n){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n));
  document.querySelectorAll(".pane").forEach((p,i)=>p.classList.toggle("active",i===n));
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
