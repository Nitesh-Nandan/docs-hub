<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Hub</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --panel2:#f1f4f8; --line:#e2e8f0;
    --txt:#1a2230; --mut:#64748b; --acc:#2563eb; --acc2:#7c3aed;
    --acc-soft:rgba(37,99,235,.08);
    --good:#15803d; --warn:#b45309; --bad:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-hover:0 12px 28px rgba(16,24,40,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --panel:#161b22; --panel2:#1f262f; --line:#2b333d;
      --txt:#e6ebf2; --mut:#8b97a6; --acc:#4c8dff; --acc2:#a78bfa;
      --acc-soft:rgba(76,141,255,.12);
      --good:#3fb950; --warn:#d29922; --bad:#f85149;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --shadow-hover:0 12px 28px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:80px;min-height:100vh}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  a{text-decoration:none;color:inherit}

  /* ---------- home hero ---------- */
  .hero{background:
      radial-gradient(900px 300px at 15% -40%, var(--acc-soft), transparent),
      linear-gradient(135deg,var(--panel),var(--panel2));
    border-bottom:1px solid var(--line);padding:46px 0 38px;margin-bottom:34px}
  .hero h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
  .hero h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{color:var(--mut);margin-top:9px;font-size:14.5px;max-width:620px}
  .statrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:19px;font-weight:800}
  .stat .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

  /* ---------- folder grid (home) ---------- */
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .folder{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .16s, box-shadow .16s, border-color .16s;overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .folder::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:0;transition:.16s}
  .folder:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--acc)}
  .folder:hover::after{opacity:1}
  .folder .ico{font-size:34px;line-height:1}
  .folder h2{font-size:18.5px;font-weight:750;display:flex;align-items:center;gap:10px}
  .folder h2 .cnt{font-size:12px;font-weight:800;color:var(--acc);background:var(--acc-soft);border-radius:12px;padding:2px 10px}
  .folder p{color:var(--mut);font-size:13.5px;line-height:1.55;flex:1}
  .folder .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .folder .meta .go{color:var(--acc);font-weight:700}
  .folder.empty-f{opacity:.72}
  .folder.empty-f:hover{opacity:1}

  /* ---------- section view ---------- */
  .secbar{background:linear-gradient(135deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);padding:24px 0 20px;margin-bottom:24px}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:12px}
  .crumb a{color:var(--acc);font-weight:700}
  .crumb a:hover{text-decoration:underline}
  .secbar h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:11px}
  .secbar h1 .cnt{font-size:12.5px;font-weight:800;color:var(--acc);background:var(--acc-soft);border-radius:12px;padding:3px 11px}
  .secbar .desc{color:var(--mut);font-size:13.5px;margin-top:7px;max-width:720px}
  .controls{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px}
  .search{flex:1;min-width:240px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px;font-size:14px;color:var(--txt);outline:none;box-shadow:var(--shadow);transition:.15s}
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .doc{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px 18px 15px;box-shadow:var(--shadow);color:var(--txt);transition:transform .14s, box-shadow .14s, border-color .14s;position:relative;overflow:hidden}
  .doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,var(--line))}
  .doc:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--acc)}
  .doc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .date{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.4px}
  .doc .open{font-size:11px;color:var(--acc);font-weight:700;opacity:0;transition:.14s}
  .doc:hover .open{opacity:1}
  .doc .ttl{font-size:14.5px;font-weight:650;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:12px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
  .chip .sc{font-weight:800}
  .chip.g{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4);color:var(--good)}
  .chip.a{background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.4);color:var(--warn)}
  .chip.r{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4);color:var(--bad)}

  .emptybox{color:var(--mut);font-size:14px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center}
  .nores{display:none;color:var(--mut);text-align:center;padding:50px 0;font-size:14.5px}
  footer{margin-top:56px;color:var(--mut);font-size:12.5px;text-align:center}
  footer code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div id="app"></div>

<script src="data/manifest.js"></script>
<script>
const M = window.MANIFEST || [];
const app = document.getElementById("app");

/* ---------- helpers ---------- */
function vcls(v, score){
  const s = (v || "").toUpperCase();
  if (s.includes("CONVICTION") || s.includes("BET")) return "g";
  if (s.includes("AVOID") || s.includes("BYE") || s.includes("NOT")) return "r";
  if (s.includes("OPPORTUNITY") || s.includes("SELECTIVE") || s.includes("WATCH")) return "a";
  if (score != null) return score >= 8 ? "g" : score >= 6 ? "a" : "r";
  return "";
}
function stripeColor(doc){
  if (!doc.stocks || !doc.stocks.length) return "var(--line)";
  const scores = doc.stocks.map(s => s.score).filter(x => x != null);
  if (!scores.length) return "var(--line)";
  const best = Math.max(...scores);
  return best >= 8 ? "var(--good)" : best >= 6 ? "var(--warn)" : "var(--bad)";
}
function chips(doc){
  if (!doc.stocks || !doc.stocks.length) return "";
  const shown = doc.stocks.slice(0, 6);
  let h = shown.map(s => `<span class="chip ${vcls(s.verdict, s.score)}">${s.sym}${s.score != null ? ` <span class="sc">${s.score}</span>` : ""}</span>`).join("");
  if (doc.stocks.length > 6) h += `<span class="chip">+${doc.stocks.length - 6} more</span>`;
  return `<div class="chips">${h}</div>`;
}
const fmt = d => d || "—";

/* ---------- home: folders only ---------- */
function renderHome(){
  const totalDocs = M.reduce((n, s) => n + s.docs.length, 0);
  const allStocks = new Set();
  let latest = "";
  M.forEach(s => s.docs.forEach(d => {
    (d.stocks || []).forEach(x => allStocks.add(x.sym));
    if (d.date > latest) latest = d.date;
  }));

  app.innerHTML = `
  <div class="hero"><div class="wrap">
    <h1>📚 Docs <span>Hub</span></h1>
    <div class="sub">Everything generated in the lab — research reports, plans and tools — organised in folders. Open a folder to browse its documents.</div>
    <div class="statrow">
      <div class="stat"><div class="n">${M.length}</div><div class="k">folders</div></div>
      <div class="stat"><div class="n">${totalDocs}</div><div class="k">documents</div></div>
      <div class="stat"><div class="n">${allStocks.size}</div><div class="k">stocks reviewed</div></div>
      <div class="stat"><div class="n">${fmt(latest)}</div><div class="k">last updated</div></div>
    </div>
  </div></div>
  <div class="wrap">
    <div class="folders">
      ${M.map(sec => {
        const latestDoc = sec.docs[0];
        return `
        <a class="folder ${sec.docs.length ? "" : "empty-f"}" href="#${sec.id}">
          <div class="ico">${sec.icon}</div>
          <h2>${sec.title} <span class="cnt">${sec.docs.length}</span></h2>
          <p>${sec.desc || "No description yet."}</p>
          <div class="meta">
            <span>${latestDoc ? "latest · " + latestDoc.date : "empty"}</span>
            <span class="go">Open →</span>
          </div>
        </a>`;
      }).join("")}
    </div>
    <footer>Add a folder + HTML files, run <code>./sync.sh</code> — it shows up here automatically.</footer>
  </div>`;
  window.scrollTo(0, 0);
}

/* ---------- section view ---------- */
function renderSection(sec){
  app.innerHTML = `
  <div class="secbar"><div class="wrap">
    <div class="crumb"><a href="#">📚 Docs Hub</a><span>/</span><span>${sec.title}</span></div>
    <h1>${sec.icon} ${sec.title} <span class="cnt">${sec.docs.length} doc${sec.docs.length === 1 ? "" : "s"}</span></h1>
    <div class="desc">${sec.desc || ""}</div>
  </div></div>
  <div class="wrap">
    ${sec.docs.length ? `
    <div class="controls">
      <div class="search"><span class="ico">🔎</span><input id="q" type="search" placeholder="Search in ${sec.title} — title, symbol, verdict…" autocomplete="off"></div>
    </div>
    <div class="grid" id="grid">
      ${sec.docs.map(d => `
      <a class="doc" href="${d.file}" target="_blank" rel="noopener"
         style="--stripe:${stripeColor(d)}"
         data-hay="${(d.title + " " + (d.stocks || []).map(s => s.sym + " " + (s.verdict || "")).join(" ")).toLowerCase()}">
        <div class="top"><span class="date">${d.date}</span><span class="open">OPEN ↗</span></div>
        <div class="ttl">${d.title}</div>
        ${chips(d)}
      </a>`).join("")}
    </div>
    <div class="nores" id="nores">No documents match “<b id="noresq"></b>”.</div>`
    : `<div class="emptybox">Nothing here yet — drop HTML files into <code>${sec.id}/</code> and run <code>./sync.sh</code>.</div>`}
    <footer><a href="#" style="color:var(--acc);font-weight:700">← Back to all folders</a></footer>
  </div>`;

  const q = document.getElementById("q");
  if (q) q.addEventListener("input", () => {
    const needle = q.value.trim().toLowerCase();
    let vis = 0;
    document.querySelectorAll("#grid .doc").forEach(doc => {
      const hit = !needle || doc.dataset.hay.includes(needle);
      doc.style.display = hit ? "" : "none";
      if (hit) vis++;
    });
    document.getElementById("nores").style.display = vis ? "none" : "";
    document.getElementById("noresq").textContent = q.value;
  });
  window.scrollTo(0, 0);
}

/* ---------- hash router ---------- */
function route(){
  const id = location.hash.replace(/^#\/?/, "");
  const sec = M.find(s => s.id === id);
  sec ? renderSection(sec) : renderHome();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
