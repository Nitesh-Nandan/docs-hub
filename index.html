<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Hub</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --panel2:#f1f4f8; --line:#e2e8f0;
    --txt:#1a2230; --mut:#64748b; --acc:#2563eb; --acc-soft:rgba(37,99,235,.08);
    --good:#15803d; --warn:#b45309; --bad:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-hover:0 8px 24px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --panel:#161b22; --panel2:#1f262f; --line:#2b333d;
      --txt:#e6ebf2; --mut:#8b97a6; --acc:#4c8dff; --acc-soft:rgba(76,141,255,.12);
      --good:#3fb950; --warn:#d29922; --bad:#f85149;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --shadow-hover:0 8px 24px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:80px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}

  header{background:linear-gradient(135deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);padding:34px 0 26px;margin-bottom:10px}
  header h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  header h1 span{color:var(--acc)}
  header .sub{color:var(--mut);margin-top:7px;font-size:14px;max-width:640px}
  .statrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:19px;font-weight:800}
  .stat .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

  .toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid transparent}
  .toolbar.stuck{border-color:var(--line)}
  .toolbar-inner{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .search{flex:1;min-width:230px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px;font-size:14px;color:var(--txt);outline:none;box-shadow:var(--shadow);transition:.15s}
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
  .navchip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:.12s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .navchip:hover{border-color:var(--acc);color:var(--txt)}
  .navchip .cnt{background:var(--panel2);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}

  section.sec{margin-top:30px}
  .sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .sechead h2{font-size:19px;font-weight:750;display:flex;align-items:center;gap:9px}
  .sechead .cnt{font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:12px;padding:2px 10px}
  .secdesc{color:var(--mut);font-size:13.5px;margin-bottom:16px;max-width:720px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .doc{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px 18px 15px;box-shadow:var(--shadow);text-decoration:none;color:var(--txt);transition:transform .14s, box-shadow .14s, border-color .14s;position:relative;overflow:hidden}
  .doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,var(--line))}
  .doc:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--acc)}
  .doc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .date{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.4px}
  .doc .open{font-size:11px;color:var(--acc);font-weight:700;opacity:0;transition:.14s}
  .doc:hover .open{opacity:1}
  .doc .ttl{font-size:14.5px;font-weight:650;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:12px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
  .chip .sc{font-weight:800}
  .chip.g{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4);color:var(--good)}
  .chip.a{background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.4);color:var(--warn)}
  .chip.r{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4);color:var(--bad)}

  .empty{color:var(--mut);font-size:13.5px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
  .nores{display:none;color:var(--mut);text-align:center;padding:50px 0;font-size:14.5px}
  footer{margin-top:56px;color:var(--mut);font-size:12.5px;text-align:center}
  footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>📚 Docs <span>Hub</span></h1>
  <div class="sub">Research reports, plans and tools — auto-published from the lab. Every card opens the full self-contained document in a new tab.</div>
  <div class="statrow" id="stats"></div>
</div></header>

<div class="toolbar" id="toolbar"><div class="wrap toolbar-inner">
  <div class="search"><span class="ico">🔎</span><input id="q" type="search" placeholder="Search title, symbol, section…" autocomplete="off"></div>
  <span id="nav"></span>
</div></div>

<div class="wrap">
  <div id="sections"></div>
  <div class="nores" id="nores">No documents match “<b id="noresq"></b>”.</div>
  <footer>Generated by <code>scripts/gen_manifest.py</code> · add a folder + HTML files and run <code>./sync.sh</code> to publish.</footer>
</div>

<script src="data/manifest.js"></script>
<script>
const M = window.MANIFEST || [];

/* verdict → color class */
function vcls(v, score){
  const s = (v || "").toUpperCase();
  if (s.includes("CONVICTION") || s.includes("BET")) return "g";
  if (s.includes("OPPORTUNITY —") || s === "OPPORTUNITY" || s.includes("SELECTIVE") || s.includes("WATCH") || s.includes("CONDITIONAL")) return s.includes("NOT") ? "r" : "a";
  if (s.includes("NOT") || s.includes("AVOID") || s.includes("BYE")) return "r";
  if (score != null) return score >= 8 ? "g" : score >= 6 ? "a" : "r";
  return "";
}
function stripeColor(doc){
  if (!doc.stocks || !doc.stocks.length) return "var(--line)";
  const best = Math.max(...doc.stocks.map(s => s.score ?? -1));
  if (best < 0) return "var(--line)";
  return best >= 8 ? "var(--good)" : best >= 6 ? "var(--warn)" : "var(--bad)";
}
function chips(doc){
  if (!doc.stocks || !doc.stocks.length) return "";
  const shown = doc.stocks.slice(0, 6);
  let h = shown.map(s => `<span class="chip ${vcls(s.verdict, s.score)}">${s.sym}${s.score != null ? ` <span class="sc">${s.score}</span>` : ""}</span>`).join("");
  if (doc.stocks.length > 6) h += `<span class="chip">+${doc.stocks.length - 6} more</span>`;
  return `<div class="chips">${h}</div>`;
}
function cleanTitle(t){ return t.replace(/^IPO Opportunity Review — /, "").replace(/ · QGLP-A$/, " · QGLP-A"); }

/* render */
const root = document.getElementById("sections");
const nav = document.getElementById("nav");
let totalDocs = 0, latest = "";

M.forEach(sec => {
  totalDocs += sec.docs.length;
  sec.docs.forEach(d => { if (d.date > latest) latest = d.date; });

  const a = document.createElement("a");
  a.className = "navchip"; a.href = "#sec-" + sec.id;
  a.innerHTML = `${sec.icon} ${sec.title} <span class="cnt">${sec.docs.length}</span>`;
  nav.appendChild(a);

  const el = document.createElement("section");
  el.className = "sec"; el.id = "sec-" + sec.id;
  el.innerHTML = `
    <div class="sechead"><h2>${sec.icon} ${sec.title}</h2><span class="cnt">${sec.docs.length} doc${sec.docs.length === 1 ? "" : "s"}</span></div>
    <div class="secdesc">${sec.desc}</div>
    ${sec.docs.length ? `<div class="grid">` + sec.docs.map(d => `
      <a class="doc" href="${d.file}" target="_blank" rel="noopener"
         style="--stripe:${stripeColor(d)}"
         data-hay="${(d.title + " " + sec.title + " " + (d.stocks || []).map(s => s.sym + " " + (s.verdict || "")).join(" ")).toLowerCase()}">
        <div class="top"><span class="date">${d.date}</span><span class="open">OPEN ↗</span></div>
        <div class="ttl">${cleanTitle(d.title)}</div>
        ${chips(d)}
      </a>`).join("") + `</div>`
      : `<div class="empty">Nothing here yet — drop HTML files into <code>${sec.id}/</code> and run <code>./sync.sh</code>.</div>`}`;
  root.appendChild(el);
});

/* stats */
const allStocks = new Set();
M.forEach(s => s.docs.forEach(d => (d.stocks || []).forEach(x => allStocks.add(x.sym))));
document.getElementById("stats").innerHTML = [
  [M.length, "sections"],
  [totalDocs, "documents"],
  [allStocks.size, "stocks reviewed"],
  [latest || "—", "last updated"],
].map(([n, k]) => `<div class="stat"><div class="n">${n}</div><div class="k">${k}</div></div>`).join("");

/* search */
const q = document.getElementById("q");
q.addEventListener("input", () => {
  const needle = q.value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll("section.sec").forEach(sec => {
    let vis = 0;
    sec.querySelectorAll(".doc").forEach(doc => {
      const hit = !needle || doc.dataset.hay.includes(needle);
      doc.style.display = hit ? "" : "none";
      if (hit) vis++;
    });
    const hasGrid = sec.querySelector(".grid");
    sec.style.display = (!hasGrid && needle) ? "none" : (hasGrid && vis === 0 && needle) ? "none" : "";
    if (vis > 0 || !needle) any = true;
  });
  document.getElementById("nores").style.display = any ? "none" : "";
  document.getElementById("noresq").textContent = q.value;
});

/* sticky toolbar shadow */
const tb = document.getElementById("toolbar");
addEventListener("scroll", () => tb.classList.toggle("stuck", scrollY > 130), {passive: true});
</script>
</body>
</html>
