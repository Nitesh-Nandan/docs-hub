<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Hub</title>
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('docs-hub-theme'); } catch(e){}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  :root[data-theme="dark"]{
    --bg:#191816; --surface:#1e1d1a; --surface2:#21201d;
    --border:#423e37; --hairline:#35322d; --rule:#b68235;
    --text:#f0ece3; --body:#a49e92; --mut:#7d786e;
    --accent:#d3a55e; --accent-deep:#b68235;
    --ghost:rgba(182,130,53,.14);
    --green-b:#5d9066; --green-t:#8fc498;
    --amber-b:#b68235; --amber-t:#d3a55e;
    --red-b:#b0625a; --red-t:#d99790;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f3f2f2; --surface:#f7f6f4; --surface2:#faf9f6;
    --border:#c9c4bb; --hairline:#ddd9d1; --rule:#b68235;
    --text:#201f1d; --body:#55524b; --mut:#8a8578;
    --accent:#8f6425; --accent-deep:#8f6425;
    --ghost:rgba(182,130,53,.13);
    --green-b:#4c7c54; --green-t:#38623f;
    --amber-b:#b68235; --amber-t:#8f6425;
    --red-b:#a8524a; --red-t:#8c4038;
    --shadow:0 2px 12px rgba(32,31,29,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-gutter:stable}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.55 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    transition:background .25s, color .25s;
    overflow-x:hidden;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-deep)}
  ::selection{background:rgba(182,130,53,.28)}
  :focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px}

  /* view transition */
  #app{opacity:0;transform:translateY(6px);transition:opacity .28s ease, transform .28s ease}
  #app.in{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){
    #app{transition:none;transform:none}
    *{transition-duration:.01ms !important}
  }

  /* ---------- masthead ---------- */
  .mast{border-bottom:1px solid var(--rule);padding:34px 0 20px}
  .mast-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:7px}
  .brand{font-size:clamp(32px,5vw,44px);font-weight:400;line-height:1;letter-spacing:.01em}
  .brand a{color:var(--text)}
  .brand a:hover{color:var(--text)}
  .brand .hub{color:var(--accent)}
  .mast-side{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut);padding-bottom:4px}
  .theme-btn{
    font:inherit;font-size:12px;letter-spacing:.06em;cursor:pointer;
    background:transparent;color:var(--accent);border:1px solid var(--accent-deep);
    padding:6px 13px;border-radius:4px;transition:background .18s,color .18s;
  }
  .theme-btn:hover{background:var(--ghost)}
  .theme-btn:active{color:var(--accent-deep)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hairline)}
  .stat{padding:20px 8px 18px 0;border-right:1px solid var(--hairline);padding-left:22px}
  .stat:first-child{padding-left:0}
  .stat:last-child{border-right:none}
  .stat .n{font-size:30px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.15}
  .stat .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:3px}
  @media (max-width:640px){
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding-left:18px}
    .stat:nth-child(odd){padding-left:0}
    .stat:nth-child(2){border-right:none}
    .stat:nth-child(-n+2){border-bottom:1px solid var(--hairline)}
  }

  /* ---------- home: collection cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:34px 0 10px}
  .col-card{
    position:relative;overflow:hidden;display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--border);border-radius:4px;
    padding:24px 26px;cursor:pointer;text-align:left;
    transition:border-color .2s, transform .2s, box-shadow .2s;
    box-shadow:none;color:inherit;font:inherit;width:100%;
  }
  .col-card:hover{border-color:var(--accent-deep);transform:translateY(-2px);box-shadow:var(--shadow)}
  .col-card:active{transform:none}
  .ghost-n{
    position:absolute;right:-10px;top:-28px;font-size:110px;line-height:1;
    color:var(--ghost);font-variant-numeric:tabular-nums;pointer-events:none;
    transition:color .2s;
  }
  .col-kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-deep)}
  .col-title{font-size:24px;font-weight:400;margin:10px 0 8px;color:var(--text);display:flex;align-items:center;gap:11px}
  .col-title .ico{font-size:21px;line-height:1}
  .col-desc{font-size:13.5px;line-height:1.55;color:var(--body);text-align:justify;text-wrap:pretty;flex:1}
  .col-foot{
    margin-top:16px;border-top:1px solid var(--hairline);padding-top:10px;
    font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;
  }
  .col-foot.empty{font-style:italic;color:var(--mut)}

  /* ---------- folder view ---------- */
  .crumb{padding:26px 0 0;font-size:13px;color:var(--mut)}
  .crumb a{letter-spacing:.04em}
  .folder-head{padding:16px 0 22px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .folder-title{font-size:clamp(26px,4vw,34px);font-weight:400;line-height:1.1}
  .folder-desc{font-size:14px;color:var(--body);margin-top:8px;max-width:620px;line-height:1.55;text-wrap:pretty}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:4px}
  .search{
    font:inherit;font-size:13.5px;background:transparent;color:var(--text);
    border:1px solid var(--border);border-radius:4px;padding:8px 13px;width:230px;max-width:60vw;
    transition:border-color .18s;
  }
  .search::placeholder{color:var(--mut);font-style:italic}
  .search:hover,.search:focus{border-color:var(--accent-deep)}
  .sort{
    font:inherit;font-size:13px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:4px;padding:8px 10px;cursor:pointer;
    transition:border-color .18s;
  }
  .sort:hover{border-color:var(--accent-deep)}

  /* doc rows */
  .docs{padding:6px 0 30px}
  .doc{
    display:flex;justify-content:space-between;align-items:center;gap:18px;
    padding:19px 6px;border-bottom:1px solid var(--hairline);color:inherit;
    transition:background .18s,border-color .18s;border-radius:2px;
  }
  .doc:hover{background:var(--ghost)}
  .doc:hover .doc-title{color:var(--accent)}
  .doc-title{font-size:17px;line-height:1.35;color:var(--text);transition:color .18s;overflow-wrap:anywhere}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{
    font-size:12px;padding:3px 9px;border:1px solid var(--border);color:var(--body);
    border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .chip.v-green{border-color:var(--green-b);color:var(--green-t)}
  .chip.v-amber{border-color:var(--amber-b);color:var(--amber-t)}
  .chip.v-red{border-color:var(--red-b);color:var(--red-t)}
  .doc-date{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
  @media (max-width:560px){
    .doc{flex-direction:column;align-items:flex-start;gap:10px}
  }

  /* empty / no-results */
  .empty-state{text-align:center;padding:70px 20px 80px;color:var(--mut)}
  .empty-state .fleuron{font-size:22px;color:var(--accent-deep);letter-spacing:.5em;margin-bottom:18px}
  .empty-state .line{font-size:17px;font-style:italic;color:var(--body)}
  .empty-state .sub{font-size:13px;margin-top:8px}

  footer{border-top:1px solid var(--hairline);margin-top:30px;padding:18px 0 42px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap"><main id="app" aria-live="polite"></main></div>

<script src="data/manifest.js"></script>
<script>
(function(){
  'use strict';
  var app = document.getElementById('app');
  var FOLDERS = (window.MANIFEST || []).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var listState = { q:'', sort:'newest' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(iso){
    if(!iso) return '';
    var p = String(iso).split('-');
    if(p.length !== 3) return esc(iso);
    return (+p[2]) + ' ' + (MONTHS[+p[1]-1]||'') + ' ' + p[0];
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }

  function verdictClass(st){
    var v = String(st.verdict||'').toUpperCase();
    if (v){
      if (v.indexOf('NOT') > -1 || v.indexOf('AVOID') > -1 || v.indexOf('BYE') > -1) return 'v-red';
      if (v.indexOf('CONVICTION') > -1 || v.indexOf('BET') > -1) return 'v-green';
      return 'v-amber';
    }
    if (st.score != null){
      return st.score >= 8 ? 'v-green' : st.score >= 6 ? 'v-amber' : 'v-red';
    }
    return '';
  }
  function chipHTML(st){
    var label = esc(st.sym);
    if (st.score != null) label += ' ' + Number(st.score).toFixed(1);
    else if (st.verdict) label += ' · ' + esc(st.verdict);
    var title = esc(st.verdict || 'unrated');
    return '<span class="chip ' + verdictClass(st) + '" title="' + title + '">' + label + '</span>';
  }

  /* ---------- shared masthead ---------- */
  function mastHTML(){
    var now = new Date();
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var dateStr = days[now.getDay()] + ' · ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var btn = dark ? '◑ Light' : '◐ Dark';
    return '' +
    '<header class="mast"><div class="mast-row">' +
      '<div>' +
        '<div class="kicker">Nitesh · Research Terminal</div>' +
        '<h1 class="brand"><a href="#">Docs <span class="hub">Hub</span></a></h1>' +
      '</div>' +
      '<div class="mast-side">' +
        '<span class="tnum">' + dateStr + '</span>' +
        '<button class="theme-btn" data-toggle-theme aria-label="Switch theme">' + btn + '</button>' +
      '</div>' +
    '</div></header>';
  }

  /* ---------- home ---------- */
  function homeHTML(){
    var docCount = 0, lastDate = '', seenSyms = {};
    FOLDERS.forEach(function(f){
      (f.docs||[]).forEach(function(d){
        docCount++;
        (d.stocks||[]).forEach(function(s){ seenSyms[s.sym] = 1; });
        if (d.date && d.date > lastDate) lastDate = d.date;
      });
    });
    var stockCount = Object.keys(seenSyms).length;
    var lastLabel = lastDate ? fmtDate(lastDate).replace(/ \d{4}$/, '') : '—';

    var html = mastHTML() +
    '<section class="stats" aria-label="Library statistics">' +
      '<div class="stat"><div class="n">' + FOLDERS.length + '</div><div class="k">Collections</div></div>' +
      '<div class="stat"><div class="n">' + docCount + '</div><div class="k">Documents</div></div>' +
      '<div class="stat"><div class="n">' + stockCount + '</div><div class="k">Stocks reviewed</div></div>' +
      '<div class="stat"><div class="n">' + lastLabel + '</div><div class="k">Last updated</div></div>' +
    '</section>' +
    '<section class="grid" aria-label="Collections">';

    FOLDERS.forEach(function(f, i){
      var n = (f.docs||[]).length;
      var foot = n
        ? '<div class="col-foot">' + n + ' document' + (n===1?'':'s') + ' →</div>'
        : '<div class="col-foot empty">Awaiting first entry</div>';
      html +=
      '<a class="col-card" href="#' + encodeURIComponent(f.id) + '">' +
        '<div class="ghost-n">' + pad2(i+1) + '</div>' +
        '<div class="col-kicker">Collection</div>' +
        '<div class="col-title">' + (f.icon ? '<span class="ico">' + esc(f.icon) + '</span>' : '') + '<span>' + esc(f.title) + '</span></div>' +
        '<div class="col-desc">' + esc(f.desc) + '</div>' +
        foot +
      '</a>';
    });
    html += '</section>' + footHTML();
    return html;
  }

  /* ---------- folder view ---------- */
  function bestScore(d){
    if (!d.stocks) return -1;
    var m = -1;
    d.stocks.forEach(function(s){ if (s.score != null && s.score > m) m = s.score; });
    return m;
  }
  function sortDocs(docs, mode){
    var a = docs.slice();
    if (mode === 'oldest') a.sort(function(x,y){ return String(x.date).localeCompare(String(y.date)); });
    else if (mode === 'score') a.sort(function(x,y){ return bestScore(y) - bestScore(x); });
    else if (mode === 'title') a.sort(function(x,y){ return String(x.title).localeCompare(String(y.title)); });
    else a.sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); });
    return a;
  }
  function matches(d, q){
    if (!q) return true;
    q = q.toLowerCase();
    if (String(d.title||'').toLowerCase().indexOf(q) > -1) return true;
    return (d.stocks||[]).some(function(s){
      return String(s.sym||'').toLowerCase().indexOf(q) > -1 ||
             String(s.verdict||'').toLowerCase().indexOf(q) > -1;
    });
  }
  function docsHTML(folder){
    var docs = (folder.docs||[]).filter(function(d){ return matches(d, listState.q); });
    docs = sortDocs(docs, listState.sort);
    if (!(folder.docs||[]).length){
      return '<div class="empty-state">' +
        '<div class="fleuron">❦</div>' +
        '<div class="line">This collection is still being written.</div>' +
        '<div class="sub">New documents appear here as they are filed.</div>' +
      '</div>';
    }
    if (!docs.length){
      return '<div class="empty-state">' +
        '<div class="fleuron">···</div>' +
        '<div class="line">Nothing matches “' + esc(listState.q) + '”.</div>' +
        '<div class="sub">Try a stock symbol, a verdict, or part of a title.</div>' +
      '</div>';
    }
    return docs.map(function(d){
      var chips = (d.stocks && d.stocks.length)
        ? '<div class="chips">' + d.stocks.map(chipHTML).join('') + '</div>' : '';
      return '<a class="doc" href="' + esc(d.file) + '" target="_blank" rel="noopener">' +
        '<div class="doc-main"><div class="doc-title">' + esc(d.title) + '</div>' + chips + '</div>' +
        '<div class="doc-date">' + fmtDate(d.date) + ' ↗</div>' +
      '</a>';
    }).join('');
  }
  function folderHTML(folder){
    var idx = FOLDERS.indexOf(folder);
    var hasDocs = (folder.docs||[]).length > 0;
    var toolbar = hasDocs ?
      '<div class="toolbar">' +
        '<input class="search" id="q" type="search" placeholder="Search title, symbol, verdict…" value="' + esc(listState.q) + '" aria-label="Search documents">' +
        '<select class="sort" id="sort" aria-label="Sort documents">' +
          '<option value="newest"' + (listState.sort==='newest'?' selected':'') + '>Newest first</option>' +
          '<option value="oldest"' + (listState.sort==='oldest'?' selected':'') + '>Oldest first</option>' +
          '<option value="score"'  + (listState.sort==='score' ?' selected':'') + '>Top score</option>' +
          '<option value="title"'  + (listState.sort==='title' ?' selected':'') + '>Title A–Z</option>' +
        '</select>' +
      '</div>' : '';
    return mastHTML() +
    '<nav class="crumb"><a href="#">← Docs Hub</a></nav>' +
    '<header class="folder-head">' +
      '<div>' +
        '<div class="kicker tnum">Collection № ' + pad2(idx+1) + '</div>' +
        '<h2 class="folder-title">' + (folder.icon ? '<span style="font-size:.8em;margin-right:10px">' + esc(folder.icon) + '</span>' : '') + esc(folder.title) + '</h2>' +
        '<p class="folder-desc">' + esc(folder.desc) + '</p>' +
      '</div>' + toolbar +
    '</header>' +
    '<section class="docs" id="doclist">' + docsHTML(folder) + '</section>' +
    footHTML();
  }

  function footHTML(){
    return '<footer><span>Docs Hub · a private research library</span><span class="tnum">' + FOLDERS.length + ' collections</span></footer>';
  }

  /* ---------- render + routing ---------- */
  var currentFolder = null;
  function render(){
    var id = decodeURIComponent((location.hash||'').slice(1));
    var folder = null;
    for (var i=0;i<FOLDERS.length;i++) if (FOLDERS[i].id === id) folder = FOLDERS[i];
    if (folder !== currentFolder){ listState = { q:'', sort:'newest' }; }
    currentFolder = folder;
    app.classList.remove('in');
    app.innerHTML = folder ? folderHTML(folder) : homeHTML();
    if (folder) wireToolbar(folder);
    window.scrollTo(0,0);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ app.classList.add('in'); }); });
  }
  function wireToolbar(folder){
    var q = document.getElementById('q');
    var sort = document.getElementById('sort');
    var list = document.getElementById('doclist');
    if (q) q.addEventListener('input', function(){
      listState.q = q.value.trim();
      list.innerHTML = docsHTML(folder);
    });
    if (sort) sort.addEventListener('change', function(){
      listState.sort = sort.value;
      list.innerHTML = docsHTML(folder);
    });
  }

  /* theme toggle (delegated — masthead re-renders per view) */
  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('[data-toggle-theme]') : null;
    if (!btn) return;
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('docs-hub-theme', next); } catch(err){}
    btn.textContent = next === 'dark' ? '◑ Light' : '◐ Dark';
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
