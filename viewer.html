<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer — Docs Hub</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.png">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('docs-hub-theme'); } catch(e){}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  :root[data-theme="dark"]{
    --bg:#191816; --surface2:#21201d; --border:#423e37; --hairline:#35322d;
    --text:#f0ece3; --mut:#7d786e; --accent:#d3a55e; --accent-deep:#b68235;
  }
  :root[data-theme="light"]{
    --bg:#f3f2f2; --surface2:#faf9f6; --border:#c9c4bb; --hairline:#ddd9d1;
    --text:#201f1d; --mut:#8a8578; --accent:#8f6425; --accent-deep:#6f4c1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);padding:0 0 60px;
    font:15px/1.55 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-deep);text-decoration:underline}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;padding:26px 0 18px;
    border-bottom:1px solid var(--hairline);margin-bottom:24px}
  .crumb{font-size:14px}
  h1{font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--mut);margin-top:8px;flex-basis:100%;word-break:break-all}
  .bar{display:flex;gap:9px;flex-wrap:wrap}
  .btn{font:600 12.5px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--surface2);color:var(--text);border:1px solid var(--border);
    border-radius:7px;padding:9px 14px;cursor:pointer;text-decoration:none;
    display:inline-block;transition:border-color .15s,color .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

  pre{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
    padding:22px 24px;overflow-x:auto;white-space:pre;tab-size:2;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
  .msg{color:var(--mut);padding:30px 0;font-size:14.5px;line-height:1.7}

  .tw{overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:var(--surface2)}
  table{border-collapse:collapse;width:100%;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  th,td{text-align:left;padding:8px 13px;border-bottom:1px solid var(--hairline);
    white-space:nowrap;color:var(--text)}
  th{position:sticky;top:0;background:var(--surface2);color:var(--mut);
    font-weight:600;border-bottom:1px solid var(--border)}
  tbody tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .hidden{display:none}
  @media (max-width:600px){.wrap{padding:0 16px}pre{padding:16px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="crumb"><a href="./">← Docs Hub</a></nav>
    <div class="bar">
      <button class="btn hidden" id="table">Table view</button>
      <button class="btn hidden" id="copy">Copy all</button>
      <a class="btn" id="raw" href="#" target="_blank" rel="noopener">Raw file</a>
      <a class="btn" id="dl" href="#" download>Download</a>
      <button class="btn" onclick="var d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('docs-hub-theme',n)}catch(e){}">Theme</button>
    </div>
    <h1 id="path"></h1>
  </header>
  <div id="out" class="msg">Loading…</div>
</div>

<script>
(function(){
  var out = document.getElementById('out');
  var copyBtn = document.getElementById('copy');
  var tableBtn = document.getElementById('table');
  var f = new URLSearchParams(location.search).get('f') || '';

  // Only allow relative paths inside this site — no protocols, no parent escapes.
  if (!f || /^[a-z]+:/i.test(f) || f.indexOf('..') > -1 || f.charAt(0) === '/') {
    out.textContent = 'No valid file given. Add ?f=<section>/<file> to the URL.';
    return;
  }

  document.getElementById('path').textContent = f;
  document.title = f.split('/').pop() + ' — Docs Hub';
  document.getElementById('raw').href = f;
  document.getElementById('dl').href = f;   // download works for every type

  var ext = (f.split('.').pop() || '').toLowerCase();
  var IMG = ['png','jpg','jpeg','gif','svg','webp'];

  // ---- non-text: show it, don't try to read it as text --------------------
  if (ext === 'pdf') {
    out.className = '';
    out.innerHTML = '<div class="tw"><iframe src="' + encodeURI(f) +
      '" style="display:block;width:100%;height:84vh;min-height:520px;border:0;background:#FDFBF6"></iframe></div>';
    return;
  }
  if (IMG.indexOf(ext) > -1) {
    out.className = '';
    out.innerHTML = '<div class="tw" style="padding:20px;text-align:center">' +
      '<img src="' + encodeURI(f) + '" alt="" style="max-width:100%;height:auto">' +
      '</div>';
    return;
  }

  // ---- text: verbatim, plus copy ------------------------------------------
  var raw = '';

  function showRaw(){
    out.className = '';
    var pre = document.createElement('pre');
    pre.textContent = raw;        // verbatim: nothing parsed, nothing rewritten
    out.innerHTML = '';
    out.appendChild(pre);
    tableBtn.textContent = 'Table view';
  }

  // Minimal RFC4180-ish split: handles quoted fields containing the delimiter.
  function splitRow(line, delim){
    var cells = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++){
      var c = line[i];
      if (q) {
        if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { cells.push(cur); cur = ''; }
      else cur += c;
    }
    cells.push(cur);
    return cells;
  }

  function showTable(){
    var delim = ext === 'tsv' ? '\t' : ',';
    var rows = raw.replace(/\r\n/g, '\n').split('\n')
                  .filter(function(l){ return l.length; })
                  .map(function(l){ return splitRow(l, delim); });
    if (!rows.length) return showRaw();
    var esc = function(s){ return String(s).replace(/[&<>]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
    var isNum = function(s){ return s !== '' && !isNaN(Number(s.replace(/,/g,''))); };
    var html = '<div class="tw"><table><thead><tr>' +
      rows[0].map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      rows.slice(1).map(function(r){
        return '<tr>' + r.map(function(c){
          return '<td' + (isNum(c) ? ' class="num"' : '') + '>' + esc(c) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    out.className = '';
    out.innerHTML = html;
    tableBtn.textContent = 'Raw text';
  }

  fetch(f).then(function(r){
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.text();
  }).then(function(txt){
    raw = txt;
    copyBtn.classList.remove('hidden');
    if (ext === 'csv' || ext === 'tsv') {
      tableBtn.classList.remove('hidden');
      showTable();                // tables are how you actually read a CSV
    } else {
      showRaw();
    }
  }).catch(function(e){
    out.textContent = 'Could not load ' + f + ' (' + e.message + '). ' +
      'Use “Raw file” or “Download” instead. ' +
      '(Local file:// previews block this — it works on the published site.)';
  });

  tableBtn.addEventListener('click', function(){
    if (this.textContent === 'Table view') showTable(); else showRaw();
  });

  copyBtn.addEventListener('click', function(){
    var btn = this;
    var done = function(ok){ btn.textContent = ok ? 'Copied ✓' : 'Press ⌘C';
      setTimeout(function(){ btn.textContent = 'Copy all'; }, 1700); };
    if (navigator.clipboard) navigator.clipboard.writeText(raw).then(function(){done(true)}, function(){done(false)});
    else done(false);
  });
})();
</script>
</body>
</html>
